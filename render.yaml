# Render Blueprint — 대시보드에서 "New → Blueprint"로 이 저장소를 연결하면
# 이 파일 그대로 서비스가 생성된다. https://render.com/docs/blueprint-spec
services:
  - type: web
    name: moo
    runtime: docker
    # 배포할 브랜치. main에 머지한 뒤에는 이 줄을 지우면 기본 브랜치를 따라간다.
    branch: claude/repo-overview-3p417x
    # free 플랜(512MB)은 Chromium 렌더링 시 메모리가 빠듯할 수 있다.
    # 매물 수집이 자주 빈 결과로 떨어지면 starter(2GB)로 올릴 것.
    plan: free
    healthCheckPath: /
    envVars:
      # 값은 Render 대시보드에서 직접 입력 (sync: false = 코드에 노출 안 함)
      - key: CLAUDE_CODE_OAUTH_TOKEN # 이미지 식별 — Claude Pro/Max 구독으로, 추가 과금 없음 (PC에서 `claude setup-token`으로 발급)
        sync: false
      - key: ANTHROPIC_API_KEY # 이미지 식별 — 종량제 API (구독 토큰을 쓰면 비워둬도 됨)
        sync: false
      - key: EBAY_APP_ID # eBay Browse API + 이미지 검색 (선택)
        sync: false
      - key: EBAY_CERT_ID
        sync: false
      - key: JINA_API_KEY # 봇 차단 우회 프록시 레이트리밋 완화 (선택)
        sync: false
      # 저장·관심목록·매입/판매 기록 대시보드 (선택). 둘 다 넣어야 켜진다.
      # 먼저 Supabase 프로젝트 생성 + supabase/schema.sql 실행. SERVICE_ROLE_KEY는 서버 전용.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
